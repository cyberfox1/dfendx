MainInfo=關於 DFendX 文件結構的信息
MainInfoPart1=DFendX 是 100% Vista/Win7 兼容的。這表示把“程序數據”分開?“程序文件”和“用戶數據”。如果你是從安裝包安裝 DFendX 時選擇 "系統用戶文件夾保存設置",程序文件是在程序文件夾裏 (默認是 "C:\Program files\DFendX"),而“用戶數據”文件是在系統用戶配置目錄的子文件夾 (默認是 "C:\Users\<你的用戶名>\DFendX")。當 DFendX 運行時不會在寫配置數據到程序的文件夾中。所有設置數據都保存在用戶配置的子文件夾中。
MainInfoPart2=DOSBox 和 Windows 使用不同的目錄結構。在 DOSBox 中的程序只看到的是整個 Windows 目錄結構的子集。所以在 DOSBox 運行的遊戲不會損害你的系統文件 (除了你設置 DOSBox 使用你真實的 "C:\" 作? DOSBox 中 C 驅動器外)。 通常情況下你是掛載一個文件夾例如 "C:\OldGames" 作? DOSBox 的 C 驅動器。 這意味?如果你保存一個遊戲? "C:\OldGames\Somegame" 你可以在 DOSBox 中通過進入 "C:\Somegame" 來存取這個遊戲。但是你不需要擔心掛載驅動器的問題,因? DFendX 會?你自動正確掛載驅動器的。
MainInfoPart3=你可以把你的遊戲保存到任何你喜歡的位置。但推薦使用預定義的遊戲目錄 ("C:\Users\<你的用戶名>\DFendX\VirtualHD")。如果你使用這個目錄放置你的遊戲, DFendX 可以在配置中使用相對路徑 (".\VirtualHD\NewGame" 代替 "C:\Users\<你的用戶名>\DFendX\VirtualHD\NewGame"). 如果 DFendX 知道遊戲文件和程序數據目錄的路徑相對關係,就能夠傳輸遊戲文件到另一個 DFendX 版本,或者?你創建安裝包,而使用絕對路徑是不能使用這個功能的。
Page1Info=請選擇你選創建配置的類型。
Page2Info=請設置你想運行的的遊戲或程序位置。如果你?文件選擇了推薦目錄的一個子目錄, DFendX 會自動使用相對路徑。
Page2InfoWindows=請設置你想運行的的遊戲或程序位置。
Page3Info=請?新配置選擇一個模板。
Page4Info=請?新遊戲或者程序定義元信息(meta information)。所有這些信息是可選的,可以在任何時候通過配置編輯器修改和補充。這表示現在這裏不需要填寫全部信息。但是強烈建議?配置至少添加一個名稱
Page5Info=請檢查由 DFendX 創建驅動器掛載的設置是否符合你的期望,然後點擊“確定”來開始創建配置。
Page6Info=請定義 ScummVM 配置。
