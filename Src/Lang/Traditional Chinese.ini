GamesFolder.Info=你可以放置被 DFendX 調用的遊戲到任何目錄。但如果你把遊戲放到 %s 的一個子目錄中,DFendX 會保存路徑?相對路徑。只有使用相對路徑你才能使用“附加功能”菜單中的“生成安裝包”和“傳輸配置”功能。
BaseDataFolder.Info=你可以放置遊戲數據文件(手冊等等) 在任何目錄。但如果你放置它們到一個 %s 的子目錄 DFendX 能夠把路徑作?相對路徑來看待。只有使用相對路徑你才能夠使用 "附加功能" 菜單裏的 "建立安裝包" 和 "傳輸遊戲" 功能。
