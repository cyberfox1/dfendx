DataFolder.AutomaticButton=從配置名稱自動選擇數據文件夾名稱
TemplateInfo=自動設置模板是一種專用的模板。每一個自動設置模板?一個特定的遊戲所創建的。DFendX 嘗試通過提供的遊戲或程序的名稱來查找匹配的自動設置模板。方法是計算真實文件的校驗和,然後和保存在模板中的檢驗和比較,也比較真實文件的文件名和保存在模板中的文件名。[13][13]如果通過校驗和找到合適的自動設置模板,你應該?你的新配置使用找到的模板,因?自動設置模板已經?你的遊戲或程序正確地設置過了。如果沒有通過校驗和找到合適模板,才使用同時文件名匹配的模板。[13][13]如果確實認?你的遊戲或程序有自動設置模板,但 DFendX 沒有在前兩個下拉列表中顯示出來,那麼你的程序是另一個沒有識別的版。[13][13]有另一種選擇,你可以在任何時候?你的新配置使用標準模板。但是如果你使用標準模板不保證你的遊戲或程序不進行一些詳細設置就能馬上運行。
