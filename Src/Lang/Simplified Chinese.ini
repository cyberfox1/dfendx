[WizardForm]
Caption=创建新配置
Button.Previous=上一步
Button.Next=下一步
MainInfo=关于 DFendX 文件结构的信息
MainInfoPart1=DFendX 是 100% Vista/Win7 兼容的。这表示把“程序数据”分开为“程序文件”和“用户数据”。如果你是从安装包安装 DFendX 时选择 "系统用户文件夹保存设置",程序文件是在程序文件夹里 (默认是 "C:\Program files\DFendX"),而“用户数据”文件是在系统用户配置目录的子文件夹 (默认是 "C:\Users\<你的用户名>\DFendX")。当 DFendX 运行时不会在写配置数据到程序的文件夹中。所有设置数据都保存在用户配置的子文件夹中。
MainInfoPart2=DOSBox 和 Windows 使用不同的目录结构。在 DOSBox 中的程序只看到的是整个 Windows 目录结构的子集。所以在 DOSBox 运行的游戏不会损害你的系统文件 (除了你设置 DOSBox 使用你真实的 "C:\" 作为 DOSBox 中 C 驱动器外)。 通常情况下你是挂载一个文件夹例如 "C:\OldGames" 作为 DOSBox 的 C 驱动器。 这意味着如果你保存一个游戏为 "C:\OldGames\Somegame" 你可以在 DOSBox 中通过进入 "C:\Somegame" 来存取这个游戏。但是你不需要担心挂载驱动器的问题,因为 DFendX 会为你自动正确挂载驱动器的。
MainInfoPart3=你可以把你的游戏保存到任何你喜欢的位置。但推荐使用预定义的游戏目录 ("C:\Users\<你的用户名>\DFendX\VirtualHD")。如果你使用这个目录放置你的游戏, DFendX 可以在配置中使用相对路径 (".\VirtualHD\NewGame" 代替 "C:\Users\<你的用户名>\DFendX\VirtualHD\NewGame"). 如果 DFendX 知道游戏文件和程序数据目录的路径相对关系,就能够传输游戏文件到另一个 DFendX 版本,或者为你创建安装包,而使用绝对路径是不能使用这个功能的。
Page1Info=请选择你选创建配置的类型。
Page2Info=请设置你想运行的的游戏或程序位置。如果你为文件选择了推荐目录的一个子目录, DFendX 会自动使用相对路径。
Page2InfoWindows=请设置你想运行的的游戏或程序位置。
Page3Info=请为新配置选择一个模板。
Page4Info=请为新游戏或者程序定义元信息(meta information)。所有这些信息是可选的,可以在任何时候通过配置编辑器修改和补充。这表示现在这里不需要填写全部信息。但是强烈建议为配置至少添加一个名称
Page5Info=请检查由 DFendX 创建驱动器挂载的设置是否符合你的期望,然后点击“确定”来开始创建配置。
Page6Info=请定义 ScummVM 配置。
