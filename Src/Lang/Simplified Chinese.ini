DataFolder.AutomaticButton=从配置名称自动选择数据文件夹名称
TemplateInfo=自动设置模板是一种专用的模板。每一个自动设置模板为一个特定的游戏所创建的。DFendX 尝试通过提供的游戏或程序的名称来查找匹配的自动设置模板。方法是计算真实文件的校验和,然后和保存在模板中的检验和比较,也比较真实文件的文件名和保存在模板中的文件名。[13][13]如果通过校验和找到合适的自动设置模板,你应该为你的新配置使用找到的模板,因为自动设置模板已经为你的游戏或程序正确地设置过了。如果没有通过校验和找到合适模板,才使用同时文件名匹配的模板。[13][13]如果确实认为你的游戏或程序有自动设置模板,但 DFendX 没有在前两个下拉列表中显示出来,那么你的程序是另一个没有识别的版。[13][13]有另一种选择,你可以在任何时候为你的新配置使用标准模板。但是如果你使用标准模板不保证你的游戏或程序不进行一些详细设置就能马上运行。
TemplateType1=使用兼容的自动设置模板 (推荐)
TemplateType1Info=这个模板是为所选择的游戏正确设置的。因为程序的校验和匹配。
TemplateType2=按文件名匹配方法来确定自动设置模板
TemplateType2Info=这个模板匹配所提供的程序文件,文件名匹配但校验和不匹配。可能你的游戏只是版本和自动设置模板中的版本不同。
TemplateType3=使用用户已定义的自动设置模板
TemplateType3Info=在这个列表中你能找到所有可用的自动设置模板。如果你确定你的新游戏是列表中的游戏之一,你可以选择相应的自动设置模板。
TemplateType4=使用用户已定义的模板
TemplateType4Info=在这个列表中你能找到所有标准用户已定义模板。你可以在任何时候为你的新配置使用任何标准模板。但是这些模板不包含对指定的游戏进行过特定的设置。
