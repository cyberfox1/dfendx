EmulationType.Windows=Windows 游戏
GamesFolder=推荐把下面的目录作为游戏目录的父目录
GamesFolder.Info=你可以放置被 DFendX 调用的游戏到任何目录。但如果你把游戏放到 %s 的一个子目录中,DFendX 会保存路径为相对路径。只有使用相对路径你才能使用“附加功能”菜单中的“生成安装包”和“传输配置”功能。
BaseDataFolder.Info=你可以放置游戏数据文件(手册等等) 在任何目录。但如果你放置它们到一个 %s 的子目录 DFendX 能够把路径作为相对路径来看待。只有使用相对路径你才能够使用 "附加功能" 菜单里的 "建立安装包" 和 "传输游戏" 功能。
