Caption=Yeni profil oluştur
Button.Previous=Önceki
Button.Next=Sonraki
MainInfo=DFendX dosya yapısı hakkında bilgi
MainInfoPart1=DFendX %100 Windows Vista ve Windows 7 uyumludur. Bu şletim sistemlerinde program dosyaları ve kullanıcı verilerini birbirinden ayrıdır. DFendX "kullanıcı profili modu" nda kuruluysa program dosyaları, program files klasöründe tutulacaktır. (Varsayılan olarak "C:\Program files\DFendX") Kullanıcı veri dosyaları ise kullanıcı profil klasörünün bir alt klasöründe tutulacaktır. (Varsayılan olarak "C:\Users\<siz>\DFendX"). DFendX çalıştığı zaman program klasörüne kesinlikle ilave veri yazmayacaktır. Böylece bütün ayar verileri kullanıcı profili alt klasöründe depolanacaktır.
MainInfoPart2=DOSBox ve Windows aynı klasör yapısını kullanmamaktadır. DOSBox içindeki programlar Windows klasör yapısının sadece bir klasörünü görür. Bu yüzden DOSBox'ta çalışan oyunlar bilgisayarınıza zarar veremez.(DOSBox'taki C: sürücüsü olarak gerçek "C:\" 'yi kullanmayı ayarlamadığınız sürece). Çoğu kimse DOSBox'taki C: sürücüsü olarak "C:\EskiOyunlar" gibi bir ayarlamayı sever. Eğer bu yöntem ile bir oyunu "C:\EskiOyunlar\Biroyun" şeklinde depolarsanız DOSBox içinde bu oyuna "C:\Biroyun" şeklinde erişirsiniz. Ama sürücü ekleme konusunda kaygılanmanız gerekmiyor çünkü DFendX doğru klasörleri sizin için otomatik olarak ekler.
MainInfoPart3=Oyunlarınızı şimdiye kadar depoladığınız yerde tutabilirsiniz. Ama ön tanımlı oyunlar klasörünü kullanmanız tavsiye edilir.("C:\Users\<siz>\DFendX\VirtualHD"). Oyunlarınız için bu klasörü kullanırsanız, DFendX profillerde bağlı yollar kullanabilir (".\VirtualHD\NewGame" "C:\Users\<you>\DFendX\VirtualHD\NewGame" yerine geçer). Bu şekilde oyun dosyalarının konumu sabit olur, oyun dosyalarını başka kurulumlara aktarabilir yada kurulum paketi oluşturulabilir. Tam yollar kullanıldığında bu mümkün değildir.
Page1Info=Lütfen oluşturulacak profil türünü seçin.
Page2Info=Lütfen başlatmak istediğiniz oyun yada program dosyasının yerini ayarlayın. Dosyalar için varsayılan klasörün bir alt klasörünü ayarlarsanız, DFendX bağlı yollar kullanabilecektir.
Page2InfoWindows=Lütfen başlatmak istediğiniz oyun yada program dosyasının yerini ayarlayın.
Page3Info=Lütfen yeni profil için bir şablon seçin.
Page4Info=Lütfen yeni oyun yada program için açıklayıcı bilgi tanımlayın. Bütün bilgileri istediğiniz zaman profil düzenleyici yardımıyla değiştirebilir ve tamamlayabilirsiniz. Bu alanların tümünün doldurulma zorunluluğu yoktur ama en azından profil için bir isim girilmesi tavsiye edilir.
Page5Info=Lütfen DFendX tarafından oluşturulmuş sürücünün doğru olup olmadığını kontrol edin ve ardından profil oluşturma sürecini "Tamam" a tıklayarak başlatın.
