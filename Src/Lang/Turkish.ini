TemplateInfo=Otomatik ayar şablonları özel tip şablonlardır. Her ayar şablonu bir oyun için özel olarak yapılmıştır. DFendX verilen oyun yada program dosyasına uyumlu otomatik ayar şablonu arar. Dosya ile depodaki checksumları karşılaştırır. [13][13]Uyumlu otomatik ayar şablonu varsa onu kullanmalısınız çünkü bu şablon tamamiyle sizin oyun yada programınız için yapılmıştır ve eklenmesi gerekir. Eğer checksumu eşleşen şablon yoksa, sadece dosya adı uyumluluğu şablonunu kullanmalısınız. [13][13]Oyun yada programınız için DFendX ilk iki açılır menü içinde oto ayar şablonu bulamadıysa, tanınmamış bir program sürümüne sahip olmalısınız. [13][13]Alternatif olarak yeni profilde her zaman normal şablon kullanabilirsiniz ama normal şablon kullanırsanız oyun yada programın çalışma garantisi yoktur ve ilave ayarlar yapılmalıdır.
