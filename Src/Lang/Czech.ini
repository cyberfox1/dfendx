DFend=DFendX je kompletně přepsaným pokračovatelem již nepokračujícího, starého dobrého programu D-Fend.[13][13]D-Fend (http://members.home.nl/mabus/) býval jedním z nejlepších nástaveb pro DOSBox a já byl velice smutný, když jsem viděl, že jeho vývoj byl ukončen.[13][13]Na druhou stranu: pokud by se vývoj D-Fendu nezastavil, nebyl by DFendX nikdy napsán.

