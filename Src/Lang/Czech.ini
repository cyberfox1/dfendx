Button.Next=Další
MainInfo=Informace o struktuře souborů v DFendX
MainInfoPart1=DFendX je 100% Vista kompatibilní. Znamená to, že respektuje oddělení souborů s programy od dat uživatele. Pokud jste DFendX nainstalovali v režimu "uživatelského profilu", pak budou soubory programu umístěny v adresáři ("C:\Program files\DFendX" je výchozím) a uživatelská data budou umístěna v podadresáři adresáře vašeho profilu ("C:\Users\<váš_profil>\DFendX" jako výchozí). Jakmile je DFendX nainstalován, již do adresáře programu více nezapisuje. Veškerá nastavení a data jsou ukládána do podadresáře vašeho uživatelského profilu.
MainInfoPart2=DOSBox a Windows nepoužívají stejnou adresářovou strukturu. Programy uvnitř DOSBoxu mají přístup pouze na vyhrazenou část z celé adresářové struktury Windows, takže hry běžící pod DOSBoxem nemohou poškodit vaše systémové soubory (pokud DOSBoxu nenastavíte svůj skutečný disk "C:\" jako disk C: v DOSBoxu). V naprosté většině případů je třeba připojit adresář typu "C:\OldGames" jako disk C: v DOSBoxu. To znamená, že pokud máte hru uloženu v "C:\OldGames\Hra_X", budete k této hře mít v DOSBoxu přístup na "C:\Hra_X". S DFendX si však nemusíte s připojováním adresářů dělat starosti, protože bude správné adresáře připojovat automaticky.
MainInfoPart3=Své hry můžete umístit kamkoli, ale doporučujeme používat předefinovaný adresář pro hry ("C:\Users\<váš_profil>\DFendX\VirtualHD"). Pokud použijete pro své hry tento adresář, může DFendX používat v profilu relativní cesty (".\VirtualHD\NewGame" namísto "C:\Users\<váš_profil>\DFendX\VirtualHD\NewGame"). Když DFendX ví, že soubory se hrou jsou umístěny relativně vůči adresáři s daty programu, může soubory se hrou přenést na jinou instalaci anebo vytvořit instalační balíček. S absolutními cestami toto není možné.
Page1Info=Vyberte si druh profilu, který chcete vytvořit.
Page2Info=Zadejte umístění hry nebo programu, které chcete spustit. Pokud si pro umístění souborů zvolíte podadresář daného adresáře, DFendX bude moci používat relativní cesty.
Page2InfoWindows=Zadejte umístění, na kterém se nachází hra nebo program, které chcete spustit.
Page3Info=Vyberte šablonu pro nový profil.
Page4Info=Nastavte informace pro novou hru či program. Všechny informace jsou volitelné a mohou být kdykoli změněny či doplněny pomocí editoru profilů. To znamená, že není nutné vyplňovat všechna pole ihned, ale doporučujeme zvolit alespoň název profilu.
Page5Info=Zkontrolujte, jestli jsou připojení jednotek vytvořená programem DFendX správná a poté spusťte proces vytváření profilu stisknutím tlačítka "Ok".
Page6Info=Nastavte konfiguraci ScummVM.
