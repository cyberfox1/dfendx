TurnOffDOSBoxFailedWarning.Hints=Pokud se DOSBox ukončí ihned po spuštění DFendX, zobrazí se obvykle dialog s běžnými nastaveními, které je třeba změnit, aby byl problém odstraněn. Tato volba vám dává možnost vypnout uvedený dialog v tomto profilu.
