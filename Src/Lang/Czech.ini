GamesFolder.Info=Hry, které chcete používat v DFendX můžete umístit do jakéhokoli adresáře, ale pokud je umístíte v podadresáři %s , bude DFendX schopen ukládat použité cesty k nim jako relativní. Pouze s relativními cestami je možné využít funkce "Vytvořit instalátor" a "Přenést profily..." z menu "Pokročilé".
BaseDataFolder.Info=Doplňkové soubory her (manuály apod.) můžete umístit do jakéhokoli adresáře, ale pokud je umístíte v podadresáři %s , bude DFendX schopen ukládat použité cesty k nim jako relativní. Pouze s relativními cestami je možné využít funkce "Vytvořit instalátor" a "Přenést profily..." z menu "Pokročilé".
