RelativePath.Hint=Tato funkce nemá nic společného s operačním režimem přenosné verze DFendX! Tato funkce umožňuje přístup k souborům uvnitř ISO obrazů připojených do DOSBoxu, na které není možný přístup ze souborového systému Windows. Pokud chcete spouštět DFendX z jiného umístění, použijte přenosnou (portable) instalaci. Tato funkce vám nepomůže vytvořit přenosný DFendX.
