TemplateInfo=Šablony automatického nastavení jsou zvláštním druhem šablon. Každá ze šablon automatického nastavení byla vytvořena pro jedinou konkrétní hru. DFendX zkouší nalézt odpovídající šablonu automatického nastavení pro danou hru či program. Z toho důvodu porovnává kontrolní součty vypočítané z konkrétního souboru s kontrolními součty uloženými v šablonách automatického nastavení.[13][13]Pokud součty souhlasí, měli byste pro nový profil takovou šablonu použít, protože tato šablona automatického nastavení byla vytvořena přesně pro vaši hru či program. Pokud neexistuje šablona se shodným součtem, můžete použít alespoň šablonu se shodným názvem.[13][13]Pokud pro váš program či hru nějaká šablona automatického nastavení existuje, ale DFendX ji nenabízí v prvních dvou vkládacích polích, pak můžete mít nějakou jinou, nerozpoznanou, verzi programu.[13][13]Pro nový profil můžete kdykoli samozřejmě použít některou z běžných šablon, ale s normální šablonou nemáte žádnou záruku, že se program či hra okamžitě spustí bez potřeby jakýchkoli dalších nastavení.
TemplateType1=Použít kompatibilní šablonu automatického nastavení (doporučeno)
TemplateType1Info=Tyto šablony jsou vytvořeny přímo pro zvolenou hru. Kontrolní součty programových souborů souhlasí.
TemplateType2=Použít šablonu automatického nastavení se shodným názvem
TemplateType2Info=Tyto šablony mají shodný název se zvoleným programem, nikoli shodné kontrolní součty. Možná se pouze liší verze vaší hry, od verze ze které byla vytvořena šablona automatického nastavení.
TemplateType3=Použít vlastní šablonu automatického nastavení
TemplateType3Info=Na tomto seznamu můžete nalézt veškeré dostupné šablony automatického nastavení. Pokud jste si jisti, že vaše hra je v seznamu, můžete si zvolit odpovídající šablonu automatického nastavení.
TemplateType4=Použít vlastní šablonu
TemplateType4Info=Na tomto seznamu můžete nalézt veškeré běžné šablony. Kdykoli můžete použít některý z těchto profilů, šablony ovšem neobsahují žádná specifická nastavení pro konkrétní hru.
