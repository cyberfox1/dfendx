TemplateInfo=Szablony auto-setup'u są specjalnym typem szablonów. Każdy szablon auto-setup'u został stworzony dla konkretnej gry. DFendX próbuje znaleźć pasujący szablon auto-setup'u porównując nazwę gry lub plik programu. Porównywane są sumy kontrolne obliczone z rzeczywistych plików z sumami kontrolnymi zawartymi w szablonach auto-setup'u oraz nazwy plików z tymi w szablonach auto-setup'u.[13][13]Jeśli taki szablon istnieje, powinieneś go użyć dla nowego profilu, ponieważ został on stworzony dla tej konkretnej gry czy programu, który chcesz dodać. Jeśli nie istnieje szablon z sumani kontrolnymi, powinieneś użyć tego z pasującą nazwą.[13][13]Jeśli dany szablon auto-setup'u istnieje, ale DFendX nie pokazuje go w żadnym z dwóch pierwszych dropdown-box'ów, to może oznaczać, że posiadasz inną, nie znaną wersję tego programu.[13][13]Możesz też zawsze użyć jednego ze zwykłych szablonów dla nowego profilu, ale nie ma wtedy gwarancji, że grę lub program będzie można uruchomić od razu, bez dodatkowego ustawiania.
