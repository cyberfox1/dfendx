[WizardForm]
Caption=Stwórz nowy profil
Button.Previous=Cofnij
Button.Next=Dalej
MainInfo=Informacja o strukturze plików DFendX
MainInfoPart1=DFendX jest w 100% kompatybilny z Vistą. Oznacza to, że respektuje podział plików programów do Program Files i danych używkownika. Jeśli zainstalowałeś DFendX w "Trybie katalogu użytkownika", pliki programów zostaną umieszczone w folderze Program files (domyślnie "C:\Program files\DFendX") a dane użytkownika w podfolderze profilu użytkownika (domyślnie "C:\Users\<twójprofil>\DFendX"). Kiedy DFendX działa, nie zapisuje niczego do folderu programu. Wszystkie ustawienia są przechowywane w podfolderze profilu użytkownika.
MainInfoPart2=DOSBox i Windows nie korzystają z takiej samej struktury katalogów. Programy pod DOSBox'em widzą tylko część całej struktury katalogów Windows, więc gry działające pod DOSBox'em nie mogą uszkodzić twoich plików systemowych (chyba,że DOSBox został ustawiony na używanie twojego prawdziwego "C:\" jako stacji C: DOSBox'a). W większości przypadków powinieneś montować folder typu  "C:\OldGames" jako stację C: DOSBox'a. Oznacza to, że jeśli masz grę w "C:\OldGames\Jakaśgra", będziesz miał do niej dostęp poprzez "C:\Jakaśgra" w DOSBox'ie. Nie musisz się wcale martwić montowaniem napędów, ponieważ DFendX zrobi to automatycznie za ciebie.
MainInfoPart3=Możesz trzymać swoje gry gdziekolwiek chcesz, ale zalecane jest używanie przygotowanego katalogu ("C:\Users\<twójprofil>\DFendX\VirtualHD"). Jeśli będziesz używać tego katalogu na swoje gry, DFendX może użyć ścieżek względnych w profilu (".\VirtualHD\NewGame" zamiast "C:\Users\<twójprofil>\DFendX\VirtualHD\NewGame"). Jeśli DFendX wie gdzie znajdują się pliki gier w odniesieniu do jego katalogów, może przenieść pliki gier do innej instalacji lub utworzyć pakiety instalacyjne. W przypadku bezwzględnych ścieżek dostępu nie jest to możliwe.
Page1Info=Wybierz rodzaj profilu jaki chcesz utworzyć.
Page2Info=Wybierz lokazlizację pliku gry lub programu, który chcesz uruchomić. Jeśli wybierzesz dla plików podkatalog danego folderu, DFendX będzie mógł używać ścieżek względnych.
Page2InfoWindows=Wybierz lokazlizację pliku gry lub programu, który chcesz uruchomić.
Page3Info=Wybierz szablon dla nowego profilu.
Page4Info=Wpisz informacje o grze lub programie. Wszystkie informacje są opcjonalne i mogą być w każdej chwili zmienione i uzupełnione w edytorze profili. Oznacza to, że nie musisz ich wprawadzać teraz, ale zalecane jest wpisanie chociaż nazwy profilu.
Page5Info=Sprawdź, czy odpowiada ci zamontowanie napędów wykonane przez DFendX i uruchom proces tworzenia profilu klikając na "OK".
Page6Info=Określ konfigurację ScummVM.
